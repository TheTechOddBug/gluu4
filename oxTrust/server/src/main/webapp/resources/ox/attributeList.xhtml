<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="value" required="true" type="java.util.List" />
</cc:interface>

<cc:implementation>
    <ui:repeat value="#{cc.attrs.value}" var="_attribute" varStatus="_attributeStatus">
		<b:label text="#{_attribute.metadata.displayName}" severity="info" />
		<gluuext:spacer width="8px"/>
    </ui:repeat>
</cc:implementation>

</html>
