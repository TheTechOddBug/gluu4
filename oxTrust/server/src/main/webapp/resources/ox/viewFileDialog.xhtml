<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:b="http://bootsfaces.net/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="id" required="true" type="java.lang.String" />
	<cc:attribute name="text" required="true" type="java.lang.String" />
	<cc:attribute name="label" default="Input Text" required="false"
		type="java.lang.String" />
	<cc:attribute name="textHeight" default="400" required="false"
		type="java.lang.Integer" />
	<cc:attribute name="textWidth" default="500" required="false"
		type="java.lang.Integer" />
</cc:interface>

<cc:implementation>
	<b:modal id="viewFile" styleClass="#{cc.attrs.id}Class"
		title="#{cc.attrs.label}" size="modal-lg">

		<h:panelGrid id="filePanel" columns="1" border="0" cellpadding="0"
			cellspacing="0" width="100%" columnClasses="alignLeft">
			<h:panelGroup>
				<h:panelGroup layout="block"
					style="width: #{cc.attrs.textWidth}px; height: #{cc.attrs.textHeight}px; overflow: auto">
					<pre>
                        <h:outputText value="#{cc.attrs.text}" />
                    </pre>
				</h:panelGroup>
			</h:panelGroup>

			<gluuext:spacer height="16" />

			<h:panelGroup>
				<b:commandButton ajax="true" look="primary" value="Back"
					oncomplete="$('.#{cc.attrs.id}Class').modal('hide'); return false;"
					immediate="true" process="@this" />
			</h:panelGroup>
		</h:panelGrid>
	</b:modal>
</cc:implementation>

</html>
