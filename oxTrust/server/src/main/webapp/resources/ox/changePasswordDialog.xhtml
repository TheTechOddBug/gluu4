<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:p="http://primefaces.org/ui"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluufn="http://www.gluu.org/jsf/functions"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="id" required="true" type="java.lang.String" />
    <cc:attribute name="label" default="Set new password" required="false" type="java.lang.String" />
    <cc:attribute name="verifyOldPassword" required="false" type="java.lang.Boolean" />
    <cc:attribute name="setPasswordMethod" required="true" method-signature="void action()" />
    <cc:attribute name="cancelPasswordMethod" required="false" method-signature="void action()" />
    <cc:attribute name="validatorBinding" required="false" type="javax.faces.component.UIComponent" />
</cc:interface>

<cc:implementation>
    <b:modal id="changePasswordModalPanel" styleClass="#{cc.attrs.id}Class"
	title="#{cc.attrs.label}" size="modal-lg">

        <h:outputStylesheet>
            .red {
                color: red;
            }
     
            .green {
               color: green;
            }
        </h:outputStylesheet>

        <h:form id="changePasswordForm">
			<b:messages/>

			<h:panelGrid id="passwordGroupId" columns="3">
				<h:outputText value="Enter old password:" rendered="#{cc.attrs.verifyOldPassword}" />
				<b:inputSecret value="#{passwordValidationAction.oldPassword}" id="old" rendered="#{cc.attrs.verifyOldPassword}" autocomplete="off"
					styleClass="form-control" process="@this" update="@next">
					<f:ajax event="blur" />
					<f:param name="blockui.disabled" value="true" />
				</b:inputSecret>
				<b:message for="old" rendered="#{cc.attrs.verifyOldPassword}" />

				<h:outputText value="Enter new password:" style="margin-top: 10px;display: block;" />
				<b:inputSecret value="#{passwordValidationAction.password}" id="pass" autocomplete="off" styleClass="form-control"
					style="margin-top: 10px;">
					<f:param name="blockui.disabled" value="true" />
				</b:inputSecret>
				<b:message for="pass" />

				<h:outputText value="Confirm the new password:" style="margin-top: 10px;display: block;" />
				<b:inputSecret value="#{passwordValidationAction.confirm}" id="conf" autocomplete="off" styleClass="form-control"
					style="margin-top: 10px;">
					<f:ajax event="blur" execute="@this, @form:pass" render="@next"/>
					<f:attribute name="confirmId" value="#{component.parent.parent.clientId}:pass" />
					<f:validator validatorId="gluuPasswordConfirmationValidator"/>
					<f:param name="blockui.disabled" value="true" />
				</b:inputSecret>
				<b:message for="conf" />
			</h:panelGrid>

			<gluuext:spacer height="16" />

			<h:panelGroup style="margin-top: 10px;display: block;">
				<b:commandButton ajax="true" look="primary" styleClass="btn btn-primary saveBindDNButton" value="Set password"
					oncomplete="if ($('.alert-danger').length == 0) {setPasswordMethod#{cc.attrs.id}(); cancelPasswordMethod#{cc.attrs.id}(); $('.#{cc.attrs.id}Class').modal('hide');}" />
				<b:commandButton ajax="true" look="primary" style="margin-left: 5px;" styleClass="btn btn-primary cancelButton" value="Cancel"
					oncomplete="$('.#{cc.attrs.id}Class').modal('hide'); return false;" rendered="#{cc.attrs.cancelPasswordMethod == null}"
					immediate="true" />
				<gluuext:spacer width="8px" />
				<b:commandButton ajax="true" look="primary" style="margin-left: 5px;" styleClass="btn btn-primary cancelButton" value="Cancel"
					oncomplete="cancelPasswordMethod#{cc.attrs.id}(); $('.#{cc.attrs.id}Class').modal('hide'); return false;"
					rendered="#{cc.attrs.cancelPasswordMethod != null}" action="#{cc.attrs.cancelPasswordMethod}" immediate="true" />
				<gluuext:spacer width="8px" height="8px" />
				<gluuext:status startText="Request in progress please wait......" />
			</h:panelGroup>
			<b:remoteCommand name="setPasswordMethod#{cc.attrs.id}" action="#{cc.attrs.setPasswordMethod}" update="@form:passwordGroupId" />
			<b:remoteCommand name="cancelPasswordMethod#{cc.attrs.id}" action="#{cc.attrs.cancelPasswordMethod}" update="@form:passwordGroupId" />
		</h:form>
    </b:modal>
</cc:implementation>

</html>
