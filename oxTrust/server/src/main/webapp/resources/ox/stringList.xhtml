<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="value" required="true" type="java.util.List" />
</cc:interface>

<cc:implementation>
    <ui:repeat value="#{cc.attrs.value}" var="_item" varStatus="_itemStatus">
        <h:outputText value="#{_item}"/><h:outputText rendered="#{itemStatus != cc.attrs.value.size() - 1}" value=", "/>
    </ui:repeat>
</cc:implementation>

</html>
