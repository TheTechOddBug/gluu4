<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:b="http://bootsfaces.net/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
	xmlns:ox="http://xmlns.jcp.org/jsf/composite/ox"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="id" required="true" type="java.lang.String" />
	<cc:attribute name="label" default="Add Groups" required="false"
		type="java.lang.String" />
	<cc:attribute name="searchPattern" required="true"
		type="java.lang.String" />
	<cc:attribute name="searchMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="acceptMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="cancelMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="updateSelectionMethod" required="false"
		method-signature="void action()" />
	<cc:attribute name="searchResult" required="true" type="java.util.List" />
	<cc:attribute name="render" required="false" type="java.lang.String" />
</cc:interface>

<cc:implementation>
	<b:modal id="selectGroupModalPanel" styleClass="#{cc.attrs.id}Class"
		title="#{cc.attrs.label}" size="modal-lg">
		<h:outputScript rendered="#{cc.attrs.updateSelectionMethod != null}">
			$('.#{cc.attrs.id}Class').on('show.bs.modal', function (event) {
				executeUpdateSelection();
		    });
		</h:outputScript>

		<h:form>
			<h:panelGrid id="groupPanelId" columns="1" border="0" cellpadding="0"
				cellspacing="0" width="100%" columnClasses="alignLeft">
				<ox:decorate id="searchPattern" hideLabel="true">
					<h:inputText value="#{cc.attrs.searchPattern}" size="30"
						maxlength="30" id="searchGroupPatternId"
						styleClass="searchParameters"
						alt="Search parameters like iNum, Display Name" />
					<b:commandButton ajax="true" look="primary" value="Search" action="#{cc.attrs.searchMethod}"
						update="@form:groupPanelId" />
				</ox:decorate>

				<h:panelGroup id="groupNoResultId"
					rendered="#{cc.attrs.searchResult.size() eq 0}">
					<h:outputText value="No Search Result Found" />
				</h:panelGroup>

				<ui:fragment rendered="#{cc.attrs.updateSelectionMethod != null}">
					<b:remoteCommand name="executeUpdateSelection" action="#{cc.attrs.updateSelectionMethod}" update="@form:groupPanelId" />
				</ui:fragment>

				<h:panelGroup
					style="overflow-y:auto; width:715px;#{cc.attrs.searchResult.size() gt 5 ? ' height:310px;' : ''}"
					layout="block" rendered="#{cc.attrs.searchResult.size() gt 0}">
					<p:dataTable id="groupListId" value="#{cc.attrs.searchResult}"
						styleClass="data sortable" var="prs">
						<p:column  width="50" headerText="X">
							<h:selectBooleanCheckbox value="#{prs.selected}" />
						</p:column>
						<p:column sortBy="#{prs.displayName}" headerText="Display Name">
							<h:outputText value="#{prs.displayName}" />
						</p:column>
						<p:column headerText="Inum" sortBy="#{prs.inum}">
							<h:outputText value="#{prs.inum}" />
						</p:column>
					</p:dataTable>
				</h:panelGroup>

				<gluuext:spacer height="16" />

				<h:panelGroup>
					<b:commandButton ajax="true" look="primary" action="#{cc.attrs.acceptMethod}" value="Ok"
						oncomplete="$('.#{cc.attrs.id}Class').modal('hide');"
						update="#{cc.attrs.render}" />
                    <gluuext:spacer width="8px"/>
                    <b:commandButton ajax="true" look="primary" action="#{cc.attrs.cancelMethod}"
						value="Cancel"
						oncomplete="$('.#{cc.attrs.id}Class').modal('hide'); return false;" />

			<gluuext:spacer width="8px" height="8px"/>
			<gluuext:status startText="Request in progress please wait......" />
				</h:panelGroup>
			</h:panelGrid>
		</h:form>
	</b:modal>
</cc:implementation>

</html>
