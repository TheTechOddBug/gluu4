<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:p="http://primefaces.org/ui"
	xmlns:b="http://bootsfaces.net/ui"
	xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
	xmlns:ox="http://xmlns.jcp.org/jsf/composite/ox"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="dialogId" required="true" type="java.lang.String" />
	<cc:attribute name="text" required="true" type="java.lang.String" />
	<cc:attribute name="textId" required="false" default="textId"
		type="java.lang.String" />
	<cc:attribute name="inputLabel" default="Text" required="false"
		type="java.lang.String" />
	<cc:attribute name="label" default="Input Text" required="false"
		type="java.lang.String" />
	<cc:attribute name="maxLength" default="128" required="false"
		type="java.lang.Integer" />
	<cc:attribute name="inputWidth" default="128" required="false"
		type="java.lang.Integer" />
	<cc:attribute name="dialogWidth" default="350" required="false"
		type="java.lang.Integer" />
	<cc:attribute name="acceptMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="cancelMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="render" required="false" type="java.lang.String" />
	<cc:attribute name="queue" default="ox" required="false"
		type="java.lang.String" />
</cc:interface>

<cc:implementation>
	<b:modal styleClass="#{cc.attrs.dialogId}Class"
		title="#{cc.attrs.label}" size="modal-lg">

		<h:form>
			<h:panelGroup>
				<ox:decorate id="text" label="#{cc.attrs.inputLabel}">
					<div class="row" style="float: left; margin-left: 3px;">
						<h:inputText value="#{cc.attrs.text}" size="40"
							styleClass="searchParameters form-control"
							id="#{cc.attrs.textId}" />
					</div>
				</ox:decorate>
				<gluuext:spacer height="16" />
				<div class="box-footer">
					<h:panelGroup>
						<b:commandButton ajax="true" look="primary" style="margin-top: 15px;"
							styleClass="btn btn-primary" action="#{cc.attrs.acceptMethod}"
							value="Ok" oncomplete="$('.#{cc.attrs.dialogId}Class').modal('hide');"
							update="@form:text:#{cc.attrs.textId} #{cc.attrs.render}"/><gluuext:spacer width="8px"/>
                    	<b:commandButton ajax="true" look="primary" style="margin-top: 15px;"
							styleClass="btn btn-primary" action="#{cc.attrs.cancelMethod}"
							value="Cancel"
							oncomplete="$('.#{cc.attrs.dialogId}Class').modal('hide'); return false;"
							update="@form:text:#{cc.attrs.textId}" process="@this"/>

			<gluuext:spacer width="8px" height="8px"/>
			<gluuext:status startText="Request in progress please wait......" />
					</h:panelGroup>
				</div>
			</h:panelGroup>
		</h:form>
	</b:modal>
</cc:implementation>

</html>
