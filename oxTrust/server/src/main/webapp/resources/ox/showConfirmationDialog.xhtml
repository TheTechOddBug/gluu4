<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:p="http://primefaces.org/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="id" required="true" type="java.lang.String" />
    <cc:attribute name="title" required="true" type="java.lang.String" />
    <cc:attribute name="message" required="true" type="java.lang.String" />
    <cc:attribute name="show" required="true" type="java.lang.Boolean" />
    <cc:attribute name="acceptMethod" required="true" method-signature="void action()" />
    <cc:attribute name="cancelMethod" required="false" method-signature="void action()" />
    <cc:attribute name="render" required="false" type="java.lang.String" />
</cc:interface>

<cc:implementation>
    <b:modal id="showConfirmationModalPanel" styleClass="#{cc.attrs.id}Class" show="#{cc.attrs.show}"
	title="#{cc.attrs.title}" size="modal-lg">
		<h:outputScript rendered="#{cc.attrs.show}">
			$(window).load(function(){ $('[id*=#showConfirmationModalPanel]').modal('show'); });
		</h:outputScript>

        <h:form>
            <h:panelGrid columns="1" border="0" cellpadding="0" cellspacing="0" width="100%" columnClasses="alignLeft">
                <h:panelGroup>
                    <h:outputText value="Warning:&#160;" styleClass="bolded" />
                    <h:outputText value="#{cc.attrs.message}" />
                </h:panelGroup>

                <gluuext:spacer height="8" />

                <h:panelGroup>
                    <b:commandButton ajax="true" look="primary" value="Ok" oncomplete="$('.#{cc.attrs.id}Class').modal('hide');" update="#{cc.attrs.render}" process="@this" action="#{cc.attrs.acceptMethod}"/><gluuext:spacer width="8px"/>
                    <b:commandButton ajax="true" look="primary" value="Cancel" oncomplete="$('.#{cc.attrs.id}Class').modal('hide'); return false;" rendered="#{cc.attrs.cancelMethod == null}" process="@this"/><gluuext:spacer width="8px"/>
                    <b:commandButton ajax="true" look="primary" value="Cancel" oncomplete="$('.#{cc.attrs.id}Class').modal('hide'); return false;" rendered="#{cc.attrs.cancelMethod != null}" process="@this"
                        action="#{cc.attrs.cancelMethod}"/>

			<gluuext:spacer width="8px" height="8px"/>
			<gluuext:status startText="Request in progress please wait......" />
                </h:panelGroup>
            </h:panelGrid>
        </h:form>
    </b:modal>
</cc:implementation>

</html>
