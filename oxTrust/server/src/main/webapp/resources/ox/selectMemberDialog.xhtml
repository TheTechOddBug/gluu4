<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:b="http://bootsfaces.net/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
	xmlns:ox="http://xmlns.jcp.org/jsf/composite/ox"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="id" required="true" type="java.lang.String" />
	<cc:attribute name="label" default="Add Members" required="false"
		type="java.lang.String" />
	<cc:attribute name="searchPattern" required="true"
		type="java.lang.String" />
	<cc:attribute name="searchMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="acceptMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="cancelMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="updateSelectionMethod" required="false"
		method-signature="void action()" />
	<cc:attribute name="searchResult" required="true" type="java.util.List" />
	<cc:attribute name="render" required="false" type="java.lang.String" />
</cc:interface>

<cc:implementation>
	<b:modal id="selectMemberModalPanel" styleClass="#{cc.attrs.id}Class"
		title="#{cc.attrs.label}" size="modal-lg">
		<h:outputScript rendered="#{cc.attrs.updateSelectionMethod != null}">
			$('.#{cc.attrs.id}Class').on('show.bs.modal', function (event) {
				executeUpdateSelection();
		    });
		</h:outputScript>

		<h:form id="memberFormId" prepend="false">
			<h:panelGrid id="memberPanelId" columns="1" border="0"
				cellpadding="0" cellspacing="0" width="100%"
				columnClasses="alignLeft">
				<ox:decorate id="searchPattern" hideLabel="true">
					<div style="float: left;">
						<h:inputText style="float: left;width: 70%;"
							value="#{cc.attrs.searchPattern}" size="30" maxlength="30"
							id="searchMemberPatternId"
							styleClass="searchParameters form-control"
							alt="Search parameters like iNum, Display Name" />

						<b:commandButton ajax="true" look="primary" style="float: left;margin-left: 5px;"
							value="Search" action="#{cc.attrs.searchMethod}"
							update="@form:memberPanelId" process="@form:searchMemberPatternId" styleClass="btn btn-primary" />
					</div>
				</ox:decorate>

				<h:panelGroup id="memberNoResultId"
					rendered="#{cc.attrs.searchResult.size() eq 0}">
					<h:outputText value="No Search Result Found" />
				</h:panelGroup>

				<ui:fragment rendered="#{cc.attrs.updateSelectionMethod != null}">
					<b:remoteCommand name="executeUpdateSelection" action="#{cc.attrs.updateSelectionMethod}" update="@form:memberPanelId" />
				</ui:fragment>

				<h:panelGroup
					style="overflow-y:auto; width:715px;#{cc.attrs.searchResult.size() gt 5 ? ' height:310px;' : ''}"
					layout="block" rendered="#{cc.attrs.searchResult.size() gt 0}">
					<p:dataTable id="memberListId"
						value="#{cc.attrs.searchResult}" styleClass="data sortable"
						var="_item">
						<p:column width="50">
							<f:facet name="header">X</f:facet>
							<h:selectBooleanCheckbox value="#{_item.selected}" />
						</p:column>
						<p:column sortBy="#{_item.displayName}">
							<f:facet name="header">Display Name</f:facet>
							<h:outputText value="#{_item.displayName}" />
						</p:column>
						<p:column sortBy="#{_item.inum}">
							<f:facet name="header">iNum</f:facet>
							<h:outputText value="#{_item.inum}" />
						</p:column>
						<p:column sortBy="#{_item.uid}">
							<f:facet name="header">UID</f:facet>
							<h:outputText value="#{_item.uid}" />
						</p:column>
						<p:column sortBy="#{_item.mail}">
							<f:facet name="header">Email</f:facet>
							<h:outputText value="#{_item.mail}" />
						</p:column>
						<p:column sortBy="#{_item.status}">
							<f:facet name="header">Status</f:facet>
							<h:outputText value="#{_item.status}" />
						</p:column>
					</p:dataTable>
				</h:panelGroup>

				<gluuext:spacer height="16" />

				<h:panelGroup>
					<b:commandButton ajax="true" look="primary" styleClass="btn btn-primary"
						action="#{cc.attrs.acceptMethod}" value="Ok"
						oncomplete="$('.#{cc.attrs.id}Class').modal('hide');"
						update="#{cc.attrs.render}" />
                    <gluuext:spacer width="8px"/>
                    <b:commandButton ajax="true" look="primary" styleClass="btn btn-primary"
						action="#{cc.attrs.cancelMethod}" value="Cancel"
						oncomplete="$('.#{cc.attrs.id}Class').modal('hide'); return false;" />

			<gluuext:spacer width="8px" height="8px"/>
			<gluuext:status startText="Request in progress please wait......" />
				</h:panelGroup>
			</h:panelGrid>
		</h:form>
	</b:modal>
</cc:implementation>

</html>
