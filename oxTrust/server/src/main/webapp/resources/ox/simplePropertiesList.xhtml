<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:b="http://bootsfaces.net/ui"
    xmlns:ox="http://xmlns.jcp.org/jsf/composite/ox"
    xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
    <cc:attribute name="tableId" default="SimplePropertiesList" type="java.lang.String" />
    <cc:attribute name="label" default="" type="java.lang.String" />
    <cc:attribute name="labelAdd" default="" type="java.lang.String" />
    <cc:attribute name="inputWidth" default="48" required="false" type="java.lang.Integer" />
    <cc:attribute name="maxItems" type="java.lang.Integer" />
    <cc:attribute name="properties" rerquired="true" type="java.util.List" />
    <cc:attribute name="propertyName" default="value" rerquired="true" type="java.lang.String" />
    <cc:attribute name="propertiesAction" rerquired="true" type="org.gluu.oxtrust.model.SimplePropertiesListModel"/>
    <cc:attribute name="required" default="false" type="java.lang.Boolean" />
</cc:interface>

<cc:implementation>
	<ox:decorate label="#{cc.attrs.label}" id="decorator">
		<h:panelGroup id="propertiesList">
			<ui:repeat value="#{cc.attrs.properties}" var="_property">
				<h:panelGrid id="#{cc.attrs.tableId}" columns="1" width="100%" border="0"
					cellpadding="0" cellspacing="0">
					<h:panelGroup id="pID2">
						<div id="pDiv" class="col-sm-11 prop" style="padding-left: 0px;">
							<h:inputText id="fInput"
								styleClass="col-md-6 form-control #{_property[cc.attrs.propertyName] eq '' ? 'NewPropertyBox' : _property[cc.attrs.propertyName]}"
								style="margin-bottom:5px;"
								value="#{_property[cc.attrs.propertyName]}"
								size="#{cc.attrs.inputWidth}" required="#{cc.attrs.required}" />
							<b:message for="@previous" autoUpdate="true"/>
						</div>

						<h:graphicImage value="/img/error.gif" rendered="#{invalid}" styleClass="errors" />
						<b:commandLink ajax="true"
							style="margin-top:5px;font-size:23px !important;"
							styleClass="removePropertyButton"
							icon="glyphicon-remove"
							action="#{cc.attrs.propertiesAction.removeItemFromSimpleProperties(cc.attrs.properties, _property)}"
							update="@parent:@parent:@parent:@parent" process="@parent:@parent:@parent:@parent" />
					</h:panelGroup>
				</h:panelGrid>
			</ui:repeat>

			<b:commandLink ajax="true"
				action="#{cc.attrs.propertiesAction.addItemToSimpleProperties(cc.attrs.properties)}"
				update="@parent" process="@parent"
				rendered="#{empty maxItems or maxItems gt properties.size()}">
				<h:outputText style="margin-left:0px;"
					styleClass="btn btn-primary addItemButton"
					value="Add #{cc.attrs.labelAdd eq null ? cc.attrs.label : cc.attrs.labelAdd}" />
			</b:commandLink>
		</h:panelGroup>
	</ox:decorate>
</cc:implementation>
</html>
