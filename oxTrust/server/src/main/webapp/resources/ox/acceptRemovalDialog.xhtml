<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:b="http://bootsfaces.net/ui"
	xmlns:p="http://primefaces.org/ui"
	xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
	xmlns:cc="http://xmlns.jcp.org/jsf/composite">

<cc:interface>
	<cc:attribute name="dialogId" required="true" type="java.lang.String" />
	<cc:attribute name="subject" required="true" type="java.lang.String" />
	<cc:attribute name="message" required="false" type="java.lang.String" />
	<cc:attribute name="value" required="true" type="java.lang.String" />
	<cc:attribute name="deleteMethod" required="true"
		method-signature="void action()" />
	<cc:attribute name="cancelMethod" required="false"
		method-signature="void action()" />
	<cc:attribute name="render" required="false" type="java.lang.String" />
</cc:interface>

<cc:implementation>

	<b:modal styleClass="#{cc.attrs.dialogId}Class"
		title="Accept #{cc.attrs.subject} removal" size="modal-lg">

		<h:panelGroup layout="block"
			styleClass="dialogBoxPanelFor#{cc.attrs.value}">
			<h:outputText value="Warning: " styleClass="font-weight-bold" />
			<br />
			<h:outputText rendered="#{cc.attrs.message eq null}"
				value="Removing #{cc.attrs.subject} '#{cc.attrs.value}' will cause any data stored 
                            in the #{cc.attrs.subject} to be permanently lost. Are you sure you want to continue?" />
			<h:outputText rendered="#{cc.attrs.message ne null}"
				value="#{cc.attrs.message}" />
		</h:panelGroup>

		<h:form>
			<b:commandButton value="Ok" look="primary" ajax="true"
				process="@this" update="#{cc.attrs.render}"
				action="#{cc.attrs.deleteMethod}"
				oncomplete="$('.#{cc.attrs.dialogId}Class').modal('hide');"
				onsuccess="$('.#{cc.attrs.dialogId}Class').modal('hide');"/>
			<gluuext:spacer width="8px" height="8px"/>
			<b:commandButton value="Cancel" look="primary"
				ajax="true"
				oncomplete="$('.#{cc.attrs.dialogId}Class').modal('hide'); return false;"
				rendered="#{cc.attrs.cancelMethod == null}" />
			<gluuext:spacer width="8px" height="8px"/>
			<b:commandButton value="Cancel" look="primary"
				rendered="#{cc.attrs.cancelMethod != null}"
				action="#{cc.attrs.cancelMethod}"
				ajax="true" process="@this"
				oncomplete="$('.#{cc.attrs.dialogId}Class').modal('hide'); return false;" />

			<gluuext:spacer width="8px" height="16px"/>
			<gluuext:status startText="Request in progress please wait......" />
		</h:form>
	</b:modal>
</cc:implementation>

</html>
