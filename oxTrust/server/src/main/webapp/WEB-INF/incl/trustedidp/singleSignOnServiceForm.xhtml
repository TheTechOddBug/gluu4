<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:panelGroup>
        <h:panelGrid columns="1" width="100%" id="trustContacts">
			<ui:repeat value="#{_trustedIdpAction.singleSignOnServices}" var="_singleSignOnService" style="width: 100%;">
                <div class="col-sm-12 box box-primary" style="padding:0px !important;">
                <b:panel look="primary" iconAwesome="fa-th-large" collapsible="false" styleClass="pbody">
                    <f:facet name="heading">
                        <ui:fragment>
                            <b:commandLink ajax="true" style="float:right;" styleClass="glyphicon glyphicon-remove" action="#{_trustedIdpAction.removeSingleSignOnServices(_singleSignOnService)}"  update="trustContacts" eventsQueue="trustQueue">
                               <!--  <h:graphicImage value="/img/remove.gif" />  -->
                            </b:commandLink>
                        </ui:fragment>
                    </f:facet>

                    <h:panelGroup columns="2" columnClasses="rf-iiii" style="height:200px;width:100%">
                    <div class="col-sm-12" style="padding:0px !important;">
                    
                        <div class="row" style="margin-bottom: 8px;margin-left:0px">
							<div class="col-sm-5">
								<label>#{msgs['trustedIdp.binding']}: </label>
							</div>

							<div class="col-sm-7 prop" style="padding-left:0px;">
									<span class="value ">
										<h:inputText styleClass ="form-control" value="#{_singleSignOnService.binding}"  />
									</span>
							</div>
						</div>
						
						<div class="row" style="margin-bottom: 8px;margin-left:0px">
							<div class="col-sm-5">
								<label>#{msgs['trustedIdp.location']}: </label>
							</div>

							<div class="col-sm-7 prop" style="padding-left:0px;">
									<span class="value ">
										<h:inputText styleClass ="form-control" value="#{_singleSignOnService.location}"  />
									</span>
							</div>
						</div>
						
                        </div>
                    </h:panelGroup>
                    
                </b:panel></div>
            </ui:repeat>
<div class="col-sm-12" style="margin-top:15px !important">
            <b:commandLink ajax="true" style="margin-top:10px !important" styleClass="btn btn-success" value="#{msgs['trustedIdp.singleSignOnServices']}" eventsQueue="trustQueue" action="#{_trustedIdpAction.addEmptyContact()}" update="trustContacts" limitRender="true" /> 
       </div> </h:panelGrid>
    </h:panelGroup>

</ui:composition>
