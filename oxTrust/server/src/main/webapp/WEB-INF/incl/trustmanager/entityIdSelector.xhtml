<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:outputStylesheet>
.left {
    text-align: left;
}
.rf-pp-cntr {
    width: 60% !important;
}
    </h:outputStylesheet>
    <b:modal id="entityIdSelector" styleClass="entityIdSelectorClass"
    	title="#{msgs['trustmanager.selectEntityID']}" size="modal-xl">

        <h:panelGrid columns="1" id="entityIdSelectionMenu">
            <h:form>
                <h:panelGrid columns="3">
                    <h:outputText value="#{msgs['trustmanager.filter']}: " />
                    <h:inputText value="#{_trustRelationshipAction.filterString}">
                    </h:inputText>
                    <b:commandButton ajax="true" look="primary" value="#{msgs['trustmanager.filter']}" action="#{_trustRelationshipAction.filterEntities()}" update="formEntityIds:EntityIds" />
                </h:panelGrid>
            </h:form>
            <h:form id="formEntityIds">
                <h:panelGroup id="EntityIds">
                    <h:selectManyListbox value="#{_trustRelationshipAction.selectedEntities}" styleClass="width: 450px;" size="10">
                        <f:selectItems value="#{_trustRelationshipAction.availableEntities}"/>
                    </h:selectManyListbox>
                </h:panelGroup>

                <div id="EntityIdUpdate">
                    <b:commandButton ajax="true" look="primary" value="Done" oncomplete="$('.entityIdSelectorClass').modal('hide');" update="trustForm:formTabId:FederationWizardEntitySelection" />
                </div>
            </h:form>

        </h:panelGrid>
    </b:modal>
</ui:composition>
