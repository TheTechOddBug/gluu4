<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:panelGrid columns="2" id="EntityRoleWhiteListFilter" columnClasses="half,half"
        rendered="#{_metadataFiltersAction.isMetadataFilterSelected('entityRoleWhiteList')}" width="100%">

        <ui:param name="_metadataFilterSelected" value="#{_metadataFiltersAction.getMetadataFilter('entityRoleWhiteList')}" />

        <b:panel look="primary" iconAwesome="fa-th-large" collapsible="false" id="EntityRoleWhiteListFilterDescription" styleClass="inpanelBody"
        	title="#{msgs['trustmanager.entityRoleWhiteListFilterHelp']}">
            #{msgs['trustmanager.metadataFilesCanGrowQuiteLarge']}
        </b:panel>
        <b:panel look="primary" iconAwesome="fa-th-large" collapsible="false" id="EntityRoleWhiteListFilterMenu"
        	title="#{msgs['trustmanager.entityRoleWhiteListFilterConfiguration']}" styleClass="inpanelBody">
            <h:panelGrid columns="2">
                <h:outputText value="#{msgs['trustmanager.removeRolelessEntityDescriptors']} " />
                <h:selectBooleanCheckbox value="#{_metadataFilterSelected.removeRolelessEntityDescriptors}" />
                <h:outputText value="#{msgs['trustmanager.removeEmptyEntitiesDescriptors']} " />
                <h:selectBooleanCheckbox value="#{_metadataFilterSelected.removeEmptyEntitiesDescriptors}" />
            </h:panelGrid>
            <h:outputText value="#{msgs['trustmanager.retainedRolesWhiteList']}" />

			<ui:repeat var="_retainedRole" value="#{_metadataFilterSelected.retainedRoles}" id="roleList">
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" columnClasses="alignTop" columns="1" width="100%">
	                <h:outputText value="#{_retainedRole}" />
	                <h:outputText value="&#160;">
	                    <b:commandLink ajax="true" action="#{_metadataFilterSelected.retainedRoles.remove(_retainedRole)}" limitRender="true" render="@form:EntityRoleWhiteListFilterMenu" process="@this">
	                        <h:graphicImage value="/img/remove.gif" />
	                    </b:commandLink>
	                </h:outputText>
                </h:panelGrid>
            </ui:repeat>
            <h:panelGrid>
                <h:outputText value="#{msgs['trustmanager.enterNewRetainedRole']}" />
                 <h:inputText requiredMessage="click to enter RetainedRole" value="#{_metadataFilterSelected.retainedRole}">
                    <f:ajax event="change" render="@form:EntityRoleWhiteListFilterMenu" />
                </h:inputText>
            </h:panelGrid>
        </b:panel>
    </h:panelGrid>
</ui:composition>
