<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:panelGrid columns="2" id="saml2ar" columnClasses="half,half" width="100%"
        rendered="#{_relyingPartyAction.isProfileConfigurationSelected('SAML2ArtifactResolution')}">

        <ui:param name="_profileConfigurationSelected" value="#{_relyingPartyAction.getProfileConfiguration('SAML2ArtifactResolution')}" />

        <b:panel id="SAML2ArtifactResolutionDescription" look="primary" iconAwesome="fa-th-large" collapsible="false"
        	title="#{msgs['trustmanager.saml2ArtifactResolutionHelp']}" styleClass="inpanelBody">
            #{msgs['trustmanager.thisProfileConfiguration']}
        </b:panel>
        <b:panel id="SAML2ArtifactResolutionMenu" look="primary" iconAwesome="fa-th-large" collapsible="false"
        	title="#{msgs['trustmanager.saml2ArtifactResolutionProfileConfiguration']}" styleClass="inpanelBody">
            <h:panelGrid columns="2">
                <h:outputText value="#{msgs['trustmanager.signResponses']} " />
                <h:selectOneMenu value="#{_profileConfigurationSelected.signResponses}">
                    <f:selectItem itemLabel="#{msgs['trustmanager.never']}" itemValue="never" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.conditional']}" itemValue="conditional" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.always']}" itemValue="always" />
                </h:selectOneMenu>
                <h:outputText value="#{msgs['trustmanager.signAssertions']} " />
                <h:selectOneMenu value="#{_profileConfigurationSelected.signAssertions}">
                    <f:selectItem itemLabel="#{msgs['trustmanager.never']}" itemValue="never" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.conditional']}" itemValue="conditional" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.always']}" itemValue="always" />
                </h:selectOneMenu>
                <h:outputText value="#{msgs['trustmanager.signRequests']} " />
                <h:selectOneMenu value="#{_profileConfigurationSelected.signRequests}">
                    <f:selectItem itemLabel="#{msgs['trustmanager.never']}" itemValue="never" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.conditional']}" itemValue="conditional" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.always']}" itemValue="always" />
                </h:selectOneMenu>
                <h:outputText value="#{msgs['trustmanager.encryptAssertions']}: " />
                <h:selectOneMenu value="#{_profileConfigurationSelected.encryptAssertions}">
                    <f:selectItem itemLabel="#{msgs['trustmanager.never']}" itemValue="never" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.conditional']}" itemValue="conditional" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.always']}" itemValue="always" />
                </h:selectOneMenu>
                <h:outputText value="#{msgs['trustmanager.encryptNameIds']} " />
                <h:selectOneMenu value="#{_profileConfigurationSelected.encryptNameIds}">
                    <f:selectItem itemLabel="#{msgs['trustmanager.never']}" itemValue="never" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.conditional']}" itemValue="conditional" />
                    <f:selectItem itemLabel="#{msgs['trustmanager.always']}" itemValue="always" />
                </h:selectOneMenu>
            </h:panelGrid>
            <h:panelGrid>
                <h:outputText value="#{_profileConfigurationSelected.profileConfigurationCertFileName}"
                    rendered="#{not empty _profileConfigurationSelected.profileConfigurationCertFileName}" />
                <b:commandLink ajax="true" action="#{_profileConfigurationSelected.setProfileConfigurationCertFileName('')}" limitRender="true" update="@form:SAML2ArtifactResolutionMenu"
                    rendered="#{not empty _profileConfigurationSelected.profileConfigurationCertFileName}" process="@this">
                    <h:graphicImage value="/img/remove.gif" />
                </b:commandLink>
            </h:panelGrid>

        </b:panel>
    </h:panelGrid>
</ui:composition>
