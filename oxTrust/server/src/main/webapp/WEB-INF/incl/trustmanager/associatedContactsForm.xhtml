<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:panelGroup>
        <h:panelGrid columns="1" width="100%" id="trustContacts">

            <ui:repeat value="#{trustContactsAction.trustContacts}" var="_contact" style="width: 100%;">
                <div class="col-sm-12 box box-primary" style="padding:0px !important;">
                <b:panel styleClass="pbody" look="primary" iconAwesome="fa-th-large" collapsible="false">
                    <f:facet name="heading">
                        <ui:fragment>
                            <h:outputText value="#{_contact.title} #{_contact.name}" rendered="#{(not empty _contact.title) or (not empty _contact.name)}" />
                            <h:outputText value="#{msgs['trustmanager.newContact']}" rendered="#{(empty _contact.title) and (empty _contact.name)}" />

                            <b:commandLink ajax="true" style="float:right;" styleClass="glyphicon glyphicon-remove" action="#{trustContactsAction.removeContact(_contact)}" update="trustContacts" eventsQueue="trustQueue">
                               <!--  <h:graphicImage value="/img/remove.gif" />  -->
                            </b:commandLink>
                        </ui:fragment>
                    </f:facet>

                    <h:panelGroup columns="2" columnClasses="rf-iiii" style="height:200px;width:100%">
                    <div class="col-sm-12" style="padding:0px !important;">
                    
                        <div class="row" style="margin-bottom: 8px;margin-left:0px">
							<div class="col-sm-5">
								<label>#{msgs['trustmanager.name']}</label>
							</div>

							<div class="col-sm-7 prop" style="padding-left:0px;">
									<span class="value ">
										<h:inputText styleClass ="form-control" value="#{_contact.name}"  />
									</span>
							</div>
						</div>
												
						
						
						<div class="row" style="padding:5px;margin-bottom: 5px;margin-left:0px">
							<div class="col-sm-5">
								<label>#{msgs['trustmanager.title']}</label>
							</div>

							<div class="col-sm-7 prop" style="padding-left:0px;">
									<span class="value ">
										<h:inputText styleClass ="form-control" value="#{_contact.title}"  />
									</span>
							</div>
						</div>
						
						<div class="row" style="padding:5px;margin-bottom: 5px;margin-left:0px">
							<div class="col-sm-5">
								<label>#{msgs['trustmanager.telephoneNumber']}</label>
							</div>

							<div class="col-sm-7 prop" style="padding-left:0px;">
									<span class="value ">
										<h:inputText styleClass ="form-control" value="#{_contact.phone}"  />
									</span>
							</div>
						</div>
                        
                        <div class="row" style="padding:5px;margin-bottom: 5px;margin-left:0px">
							<div class="col-sm-5">
								<label>#{msgs['trustmanager.mail']}</label>
							</div>

							<div class="col-sm-7 prop" style="padding-left:0px;">
									<span class="value ">
										<h:inputText styleClass ="form-control" value="#{_contact.mail}"  />
									</span>
							</div>
						</div>
                        </div>
                    </h:panelGroup>
                    
                </b:panel></div>
            </ui:repeat>
			<div class="col-sm-12" style="margin-top:15px !important">
			<h:commandLink style="margin-top:10px !important" styleClass="btn btn-success" value="#{msgs['trustmanager.addNewContact']}">
				<f:ajax event="click" action="#{trustContactsAction.addEmptyContact()}" render="trustContacts" execute="@this"/>
			</h:commandLink>
       </div> </h:panelGrid>
    </h:panelGroup>

</ui:composition>
