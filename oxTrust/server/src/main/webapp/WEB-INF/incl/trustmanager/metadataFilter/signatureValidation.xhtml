<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext">

    <h:panelGrid columns="2" id="SignatureValidationFilter" columnClasses="half,half"
        rendered="#{_metadataFiltersAction.isMetadataFilterSelected('signatureValidation')}" width="100%">

        <ui:param name="_metadataFilterSelected" value="#{_metadataFiltersAction.getMetadataFilter('signatureValidation')}" />

        <b:panel id="SignatureValidationFilterDescription" look="primary" iconAwesome="fa-th-large" collapsible="false"
        	title="#{msgs['trustmanager.signatureValidationFilterHelp']}" styleClass="inpanelBody">
            #{msgs['trustmanager.thisMetadataFilterValidate']}
        </b:panel>
        <b:panel id="SignatureValidationFilterMenu" look="primary" iconAwesome="fa-th-large" collapsible="false"
        	title="#{msgs['trustmanager.signatureValidationFilterConfiguration']}" bodyClass="inpanelBody">
            <h:panelGrid columns="2">
                <h:outputText value="requireSignedMetadata: " />
                <h:selectBooleanCheckbox value="#{_metadataFilterSelected.requireSignedMetadata}" />
            </h:panelGrid>
            <h:outputText value="#{msgs['trustmanager.validationCertificate']}" />
            <h:panelGrid>
                <h:outputText value="#{_metadataFilterSelected.filterCertFileName}" rendered="#{not empty _metadataFilterSelected.filterCertFileName}" />
                <b:commandLink ajax="true" action="#{_metadataFilterSelected.setFilterCertFileName('')}" limitRender="true" update="@form:SignatureValidationFilterMenu"
                    rendered="#{not empty _metadataFilterSelected.filterCertFileName}" process="@this">
                    <h:graphicImage value="/img/remove.gif" />
                </b:commandLink>
            </h:panelGrid>
        </b:panel>
    </h:panelGrid>
</ui:composition>
