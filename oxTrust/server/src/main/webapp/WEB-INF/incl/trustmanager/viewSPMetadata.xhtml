<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:outputStylesheet>
        .dr-mpnl-pnl {
            overflow: auto !important
        }
    </h:outputStylesheet>

    <b:modal id="spMetadataPanel" styleClass="spMetadataPanelClass" rendered="#{not empty _trustRelationshipAction.metadata}" size="modal-xlg88">
        <b:form>
            <pre>
                <h:outputText value="#{_trustRelationshipAction.metadata}" />
            </pre>
            <b:commandButton value="#{msgs['trustmanager.back']}" oncomplete="$('.spMetadataPanelClass').modal('hide');" />
        </b:form>
    </b:modal>
</ui:composition>
