<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:panelGrid columns="2" id="ValidationFilter" columnClasses="half,half"
        rendered="#{_metadataFiltersAction.isMetadataFilterSelected('validation')}" width="100%">

        <ui:param name="_metadataFilterSelected" value="#{_metadataFiltersAction.getMetadataFilter('validation')}" />

        <b:panel id="ValidationFilterDescription" look="primary" iconAwesome="fa-th-large" collapsible="false"
        	title="#{msgs['trustmanager.validationFilterHelp']}" styleClass="inpanelBody">
            #{msgs['trustmanager.theMetadataFilterValidate']}
        </b:panel>
        <b:panel id="ValidationFilterMenu" look="primary" iconAwesome="fa-th-large" collapsible="false"
        	title="#{msgs['trustmanager.validationFilterConfiguration']}" styleClass="inpanelBody">
            <h:outputText value="#{msgs['trustmanager.addedExtensionSchemas']}" />
            
            <ui:repeat var="_extensionSchema" value="#{_metadataFilterSelected.extensionSchemas}" id="schemaList">
				<h:panelGrid border="0" cellpadding="0" cellspacing="0" columnClasses="alignTop" columns="1" width="100%">
                <h:outputText value="#{_extensionSchema}" />
                <h:outputText value="&#160;">
                    <b:commandLink ajax="true" action="#{_metadataFilterSelected.extensionSchemas.remove(_extensionSchema)}" limitRender="true" update="@form:ValidationFilterMenu">
                        <h:graphicImage value="/img/remove.gif" />
                    </b:commandLink>
                </h:outputText>
                </h:panelGrid>
            </ui:repeat>
            <h:panelGrid>
                <h:outputText value="#{msgs['trustmanager.enterNewExtensionSchema']}" />
                <h:inputText requiredMessage="#{msgs['trustmanager.clickToEnterExtensionSchema']}" value="#{_metadataFilterSelected.extensionSchema}">
                    <f:ajax event="change" render="@form:ValidationFilterMenu" />
                </h:inputText>
            </h:panelGrid>
        </b:panel>
    </h:panelGrid>
</ui:composition>
