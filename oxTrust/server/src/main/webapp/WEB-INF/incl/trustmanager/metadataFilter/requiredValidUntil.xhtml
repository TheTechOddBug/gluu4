<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
	xmlns:f="http://xmlns.jcp.org/jsf/core"
	xmlns:h="http://xmlns.jcp.org/jsf/html"
	xmlns:b="http://bootsfaces.net/ui"
	xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
	xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

	<h:panelGrid columns="2" id="RequiredValidUntilFilter"
		columnClasses="half,half"
		rendered="#{_metadataFiltersAction.isMetadataFilterSelected('requiredValidUntil')}"
		width="100%">

		<ui:param name="_metadataFilterSelected"
			value="#{_metadataFiltersAction.getMetadataFilter('requiredValidUntil')}" />

		<b:panel look="primary" iconAwesome="fa-th-large" collapsible="false" id="RequiredValidUntilFilterDescription"
			title="RequiredValidUntil Filter help" styleClass="inpanelBody">
            #{msgs['trustmanager.thisMetadataFilterRequiresThePresence']}
        </b:panel>
		<b:panel look="primary" iconAwesome="fa-th-large" collapsible="false" id="RequiredValidUntilFilterMenu"
			title="#{msgs['trustmanager.requiredValidUntilFilter']}" styleClass="inpanelBody">
			<h:panelGrid>
				<h:outputText
					value="#{msgs['trustmanager.enterMaxValidatyInternal']}" />
				<b:touchSpin col-md="6" min="0" max="2147483647"
					value="#{_metadataFilterSelected.maxValidityInterval}" step="86400" />
			</h:panelGrid>
		</b:panel>
	</h:panelGrid>
</ui:composition>
