<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:ox="http://xmlns.jcp.org/jsf/composite/ox"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

  <b:modal id="additionalTRParamsPanel" styleClass="additionalTRParamsPanelClass" title="#{msgs['trustmanager.metadataFiltersConfiguration']}" size="modal-xlg8">

        <h:form id="MetadataFilterForm">
            <h:panelGrid columns="1" id="MetadataFilterMenu">
				<ox:pickList listId="metadataFilterSelection" sourceList="#{metadataFiltersAction.availableMetadataFilters}"
					targetList="#{metadataFiltersAction.metadataFilters}"
					sourceCaption="#{msgs['trustmanager.availableFilter']}" targetCaption="Selected Filters"
					converterId="metadataFilterConverter"
					listHeight="150" listWidth="230" update="@form:MetadataFilterConfigMenu"/>

                <h:panelGroup id="MetadataFilterConfigMenu">
                    <h:panelGroup style="overflow:auto; height: 300px; width: 520px;" layout="block" rendered="#{metadataFiltersAction.metadataFilters.size() > 0}">
                        <ui:decorate template="/WEB-INF/incl/trustmanager/metadataFilter/validation.xhtml">
                            <ui:param name="_metadataFiltersAction" value="#{metadataFiltersAction}" />
                        </ui:decorate>
    
                        <ui:decorate template="/WEB-INF/incl/trustmanager/metadataFilter/entityRoleWhiteList.xhtml">
                            <ui:param name="_metadataFiltersAction" value="#{metadataFiltersAction}" />
                        </ui:decorate>
    
                        <ui:decorate template="/WEB-INF/incl/trustmanager/metadataFilter/requiredValidUntil.xhtml">
                            <ui:param name="_metadataFiltersAction" value="#{metadataFiltersAction}" />
                        </ui:decorate>
    
                        <ui:decorate template="/WEB-INF/incl/trustmanager/metadataFilter/signatureValidation.xhtml">
                            <ui:param name="_metadataFiltersAction" value="#{metadataFiltersAction}" />
                        </ui:decorate>
                    </h:panelGroup>
                </h:panelGroup>
            </h:panelGrid>

            <div id="filtersUpdate">
                <b:commandButton ajax="true" look="primary" styleClass="btn btn-primary" value="#{msgs['trustmanager.save']}" action="#{metadataFiltersAction.saveFilters}" oncomplete="$('.additionalTRParamsPanelClass').modal('hide');" render="@form:MetadataFilterMenu" />
                <b:commandButton ajax="true" look="primary" styleClass="btn btn-primary" value="#{msgs['trustmanager.back']}" oncomplete="$('.additionalTRParamsPanelClass').modal('hide');" immediate="true" />
            </div>
        </h:form>
    </b:modal>
</ui:composition>
