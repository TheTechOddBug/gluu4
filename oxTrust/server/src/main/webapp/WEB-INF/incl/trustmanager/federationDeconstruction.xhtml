<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:ox="http://xmlns.jcp.org/jsf/composite/ox"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:outputStylesheet>
        .left {
            text-align: left;
        }
    </h:outputStylesheet>

    <b:modal id="federationDeconstruction" styleClass="federationDeconstructionClass" rendered="#{_trustRelationship.isFederation()}"
    	title="#{msgs['trustmanager.selectWhichMembers']}" size="modal-xl">
        <f:facet name="controls">
            <h:graphicImage value="/img/close.gif" styleClass="hidelink" style="cursor:pointer" onclick="$('.federationDeconstructionClass').modal('hide'); return false;" />
        </f:facet>

        <h:panelGrid columns="1" id="federationDeconstructionMenu">
            <h:form>
                <h:panelGrid columns="3">
                    <h:outputText value="Filter: " />
                    <h:inputText value="#{federationDeconstructionAction.filterString}">

                    </h:inputText>
                    <b:commandButton ajax="true" look="primary" value="Filter" action="#{federationDeconstructionAction.filterEntities()}" update="federationDeconstructionMenu" />
                </h:panelGrid>
            </h:form>

            <h:form id="federationDeconstructionForm">
				<ox:pickList listId="federationDeconstructionSelection" sourceList="#{federationDeconstructionAction.bulkEntities}"
					targetList="#{federationDeconstructionAction.managedEntities}"
					converterId="stringConverter"
					sourceCaption="#{msgs['trustmanager.availableFederationMembers']}" targetCaption="#{msgs['trustmanager.membersSelectedForIndividualsConfiguration']}"
					listHeight="150" listWidth="230"
					update="federationDeconstructionForm:federationDeconstructionConfigMenu"/>
                <h:panelGroup id="federationDeconstructionConfigMenu">
                    <h:panelGrid columns="2" rendered="#{federationDeconstructionAction.selectedTR ne null}">
                                Display Name
                                    <h:inputText value="#{federationDeconstructionAction.selectedTRDisplayName}" size="40" maxlength="60" />

                
                                Description
                                    <h:inputTextarea value="#{federationDeconstructionAction.selectedTRDescription}" rows="3" size="40" maxlength="4000" />
                    </h:panelGrid>

                </h:panelGroup>
                <div id="DeconstructionUpdate">
                    <b:commandButton ajax="true" look="primary" value="Save" action="#{federationDeconstructionAction.saveEntityList()}" update=""
                        oncomplete="$('.federationDeconstructionClass').modal('hide');" />
                    <b:commandButton ajax="true" look="primary" value="Back" oncomplete="$('.federationDeconstructionClass').modal('hide'); return false;" />
                </div>
            </h:form>
        </h:panelGrid>
    </b:modal>
</ui:composition>
