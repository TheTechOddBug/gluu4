<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:gluuext="http://xmlns.jcp.org/jsf/composite/gluuext"
    xmlns:c="http://xmlns.jcp.org/jsp/jstl/core">

    <h:outputStylesheet>
        .dr-mpnl-pnl {overflow:auto!important}
    </h:outputStylesheet>

    <b:modal id="POPPanel" styleClass="POPPanelClass" title="#{msgs['trustmanager.policesAndOperatingProcedures']}" size="modal-xl">
        <h:panelGroup id="popPanelRules">
            <pre>
                <h:outputText value="#{joinFederationAction.rules}" rendered="#{joinFederationAction.federationProposal.containerFederation ne null}"/>
            </pre>
        </h:panelGroup>

        <b:commandButton ajax="true" look="primary" value="#{msgs['trustmanager.back']}" oncomplete="$('.POPPanelClass').modal('hide');" />
    </b:modal>
</ui:composition>
