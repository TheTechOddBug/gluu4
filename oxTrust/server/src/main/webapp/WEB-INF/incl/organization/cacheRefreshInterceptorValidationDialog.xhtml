<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<f:subview xmlns="http://www.w3.org/1999/xhtml"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:b="http://bootsfaces.net/ui"
    xmlns:f="http://xmlns.jcp.org/jsf/core">
    <b:modal id="cacheRefreshInterceptorValidationModelPanel" size="modal-lg">
		<h:outputScript rendered="#{_configureCacheRefreshAction.showInterceptorValidationDialog}">
			$(window).load(function(){ $('[id*=#cacheRefreshInterceptorValidationModelPanel]').modal('show'); });
		</h:outputScript>
		<f:facet name="header">
            <h:panelGroup>
                <h:outputText value="Validation messages"></h:outputText>
            </h:panelGroup>
        </f:facet>
        <f:facet name="controls">
            <h:graphicImage value="/img/close.gif" styleClass="hidelink" style="cursor:pointer" onclick="$('.cacheRefreshInterceptorValidationModelPanelClass').modal('hide'); return false;" />
        </f:facet>
        <h:outputText value="#{_configureCacheRefreshAction.interceptorValidationMessage}" converter="org.gluu.jsf2.converter.newLineToBRConverter" escape="false"/>
    </b:modal>

    #{_configureCacheRefreshAction.hideShowInterceptorValidationDialog()}

</f:subview>
