{{- if .Values.global.oxshibboleth.enabled }}

{{- /* Start of DestinationRule definition (only if sidecar is not enabled) */}}
{{- if and (eq .Values.gateway.className "istio") (not .Values.global.istio.enabled) }}
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: oxshibboleth-istio
  namespace: {{ .Release.Namespace }}
spec:
  host: oxshibboleth.{{ .Release.Namespace }}.svc.cluster.local
  trafficPolicy:
    loadBalancer:
      consistentHash:
        httpCookie:
          name: shib-stateful-route
          path: /idp
          ttl: {{ .Values.additionalConfig.istio.sessionCookieLifetime | quote }}
          attributes:
          - name: Secure
            value: ""
{{- end }}
{{- /* End of DestinationRule definition */}}

{{- end }}
