{{- $fullName := include "gateway-api.fullname" . -}}
{{- $namespace := .Release.Namespace -}}
{{- $gatewayNamespace := .Values.routes.gatewayNamespace | default $namespace -}}
{{- $httpSection := .Values.routes.httpSectionName | default "http" -}}
{{- $httpsSection := .Values.routes.httpsSectionName | default "https" -}}

{{- /* ======================================================== */}}
{{- /* 1. OXAUTH ROUTES                                         */}}
{{- /* ======================================================== */}}

{{- /* oxauth: Public (HTTP/HTTPS No Redirect) */}}
{{- if .Values.routes.authServerEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-oxauth-public
  namespace: {{ $namespace }}
{{- if .Values.routes.labels }}
  labels:
{{- toYaml .Values.routes.labels | nindent 4 }}
{{- end }}
{{- if .Values.routes.annotations }}
  annotations:
{{- toYaml .Values.routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    namespace: {{ $gatewayNamespace }}
  hostnames:
  - {{ .Values.global.domain | quote }}
  rules:
  {{- if .Values.routes.deviceCodeEnabled }}
  - matches:
    - path:
        type: Exact
        value: /device-code
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /oxauth/device_authorization.htm
    backendRefs:
    - name: oxauth
      port: 8080
  {{- end }}
  {{- if .Values.routes.openidConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/openid-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /oxauth/.well-known/openid-configuration
    backendRefs:
    - name: oxauth
      port: 8080
  {{- end }}
  {{- if .Values.routes.firebaseMessagingEnabled }}
  - matches:
    - path:
        type: Exact
        value: /firebase-messaging-sw.js
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /oxauth/firebase-messaging-sw.js
    backendRefs:
    - name: oxauth
      port: 8080
  {{- end }}
  {{- if .Values.routes.webfingerEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/webfinger
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /oxauth/.well-known/webfinger
    backendRefs:
    - name: oxauth
      port: 8080
  {{- end }}
  {{- if .Values.routes.webdiscoveryEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/simple-web-discovery
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /oxauth/.well-known/simple-web-discovery
    backendRefs:
    - name: oxauth
      port: 8080
  {{- end }}
  {{- if .Values.routes.u2fConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/fido-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /oxauth/restv1/fido-configuration
    backendRefs:
    - name: oxauth
      port: 8080
  {{- end }}
  {{- if .Values.routes.uma2ConfigEnabled }}
  - matches:
    - path:
        type: Exact
        value: /.well-known/uma2-configuration
    filters:
    - type: URLRewrite
      urlRewrite:
        path:
          type: ReplaceFullPath
          replaceFullPath: /oxauth/restv1/uma2-configuration
    backendRefs:
    - name: oxauth
      port: 8080
  {{- end }}
{{- end }}

{{- /* oxauth: Secure (HTTPS) and Redirect (HTTP -> HTTPS) */}}
{{- if .Values.routes.authServerEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-oxauth-secure
  namespace: {{ $namespace }}
{{- if .Values.routes.labels }}
  labels:
{{- toYaml .Values.routes.labels | nindent 4 }}
{{- end }}
{{- if .Values.routes.annotations }}
  annotations:
{{- toYaml .Values.routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    namespace: {{ $gatewayNamespace }}
    sectionName: {{ $httpsSection }}
  hostnames:
  - {{ .Values.global.domain | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /oxauth
    backendRefs:
    - name: oxauth
      port: 8080

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-oxauth-redirect
  namespace: {{ $namespace }}
{{- if .Values.routes.labels }}
  labels:
{{- toYaml .Values.routes.labels | nindent 4 }}
{{- end }}
{{- if .Values.routes.annotations }}
  annotations:
{{- toYaml .Values.routes.annotations | nindent 4 }}
{{- end }}
spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    namespace: {{ $gatewayNamespace }}
    sectionName: {{ $httpSection }}
  hostnames:
  - {{ .Values.global.domain | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /oxauth
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
{{- end }}


