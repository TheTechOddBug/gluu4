spec:
  parentRefs:
  - name: {{ .Values.gateway.name }}
    namespace: {{ $gatewayNamespace }}
    sectionName: {{ $httpsSection }}
  hostnames:
  - {{ .Values.global.domain | quote }}
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /idp
    backendRefs:
    {{- if eq .Values.gateway.className "traefik" }}
    # Traefik requires a TraefikService backend for Shibboleth's CRD-specific service reference
    - name: oxshibboleth-traefik
      port: 8080
      kind: TraefikService
      group: "traefik.io"
    {{- else }}
    - name: oxshibboleth
      port: 8080
    {{- end }}

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-shibboleth-redirect
  namespace: {{ $namespace }}
{{- if .Values.routes.labels }}
