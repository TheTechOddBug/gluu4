{{- /* ======================================================== */}}
{{- /* 6. OXSHIBBOLETH ROUTES                                   */}}
{{- /* ======================================================== */}}

{{- if .Values.routes.shibEnabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}-shibboleth-secure
  namespace: {{ $namespace }}
{{- if .Values.routes.labels }}
