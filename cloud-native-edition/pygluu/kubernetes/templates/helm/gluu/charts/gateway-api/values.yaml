nameOverride: ""
fullnameOverride: ""

# -- Configuration for Gateway resource
gateway:
  # -- Enable Gateway API and create Gateway resource (if disabled, you can create and manage the Gateway resource externally).
  enabled: true
  # -- Set the gatewayClassName corresponding to your installed controller.
  className: nginx
  # -- The name of the Gateway resource to be created
  name: gluu-gateway
  # -- Gateway http port number
  httpPort: 80
  # -- Gateway https port number
  httpsPort: 443
  # -- Secret containing the TLS certificate for the Gateway
  tlsSecretName: tls-certificate
  # -- Attach global.lbIp to Gateway spec.addresses with IPAddress type (enable this if loadbalancer doesn't assign IP address to Gateway automatically)
  attachLbIp: false
  # -- Specific labels for the Gateway resource
  labels: {}
  # -- Specific annotations for the Gateway resource
  annotations: {}
  # -- Gateway spec.infrastructure
  infrastructure:
    # -- Specific parametersRef for the infrastructure
    # Some gateway implementation like `airlock-microgateway` may need to attach GatewayParameters to create Loadbalancer service automatically.
    parametersRef: {}
    # -- Specific labels for the infrastructure
    labels: {}
    # -- Specific annotations for the infrastructure
    annotations: {}
# -- Configuration for HTTPRoute and its related resources
routes:
  # -- Namespace the Gateway resource is deployed in (if different from the release namespace, make sure to create the namespace beforehand and set up necessary RBAC permissions for the controller to manage resources in that namespace). Typically, the HTTPRoute resource will be created in the same namespace as the Gateway resource, but if the gateway is externally managed and deployed in a different namespace, you can set the namespace for HTTPRoute resource here.
  gatewayNamespace: ""
  # -- Set the httpSectionName and httpsSectionName according to your installed controller if it doesn't work with default values (e.g. some controller may require the listener name to be `default`).
  httpSectionName: http
  httpsSectionName: https
  # -- Specific labels for the HTTPRoute resource
  labels: {}
  # -- Specific annotations for the HTTPRoute resource
  annotations: {}
  # -- Base endpoint
  rootPath: /
  # -- Enable Admin UI endpoints /identity
  adminUiEnabled: true
  # -- Enable endpoint /.well-known/openid-configuration
  openidConfigEnabled: true
  # -- Enable endpoint /device-code
  deviceCodeEnabled: true
  # -- Enable endpoint /firebase-messaging-sw.js
  firebaseMessagingEnabled: true
  # -- Enable endpoint /.well-known/uma2-configuration
  uma2ConfigEnabled: true
  # -- Enable endpoint /.well-known/webfinger
  webfingerEnabled: true
  # -- Enable endpoint /.well-known/simple-web-discovery
  webdiscoveryEnabled: true
  # -- Enable endpoint /.well-known/scim-configuration
  scimConfigEnabled: false
  # -- Enable SCIM endpoints /scim
  scimEnabled: false
  # -- Enable endpoint /.well-known/fido-configuration
  u2fConfigEnabled: true
  # -- Enable endpoint /.well-known/fido2-configuration
  fido2ConfigEnabled: false
  # -- Enable all fido2 endpoints
  fido2Enabled: false
  # -- Enable Auth server endpoints /oxauth
  authServerEnabled: true
  # -- Enable casa endpoints /casa
  casaEnabled: false
  # -- Enable passport endpoints /passport
  passportEnabled: false
  # -- Enable shibboleth endpoints /idp
  shibEnabled: false
# -- Additional configuration for Specific Gateway API implementation
additionalConfig:
  # -- Configuration for NGINX Fabric.
  nginx:
    # -- Enable nginx ip_hash loadbalancing for supported service e.g. oxshibboleth (enable this if using nginx fabric OSS version).
    # See https://docs.nginx.com/nginx-gateway-fabric/traffic-management/session-persistence/ for details.
    ipHashLbEnabled: false
  # -- Configuration for Traefik.
  traefik: {}
  # -- Configuration for Istio.
  istio:
    # -- TTL of cookie for session affinity.
    sessionCookieLifetime: 0s
  # -- Configuration for kgateway.
  kgateway:
    # -- TTL of cookie for session affinity.
    sessionCookieLifetime: 0s
  # -- Configuration for Cilium.
  cilium:
    # -- Create Cilium IP pool with the specified blocks. See https://docs.cilium.io/en/stable/network/lb-ipam/ for details.
    ipPoolBlocks: []
  # -- Configuration for Airlock Microgateway
  airlock:
    # -- Create LoadBalancer service using GatewayParameters (by default airlock-microgateway doesn't create the service).
    # See https://docs.airlock.com/microgateway/latest/index/api/crds/gateway-parameters/v1alpha1/ for details.
    # The GatewayParameters will be attached to gateway.infrastructure.parametersRef only if it's empty.
    createLbService: false
  # -- Configuration for Envoy.
  envoy:
    # -- Create GatewayClass named `envoy` (by default Envoy doesn't create gatewayclass). The `envoy` name can be set as value of `gateway.className` attribute.
    createGatewayClass: false
